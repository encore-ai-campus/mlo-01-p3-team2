# Local single-broker integration test. Production replication settings are separate.
process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=kafka:9093
controller.listener.names=CONTROLLER
listeners=INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:39092,CONTROLLER://0.0.0.0:9093
advertised.listeners=INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:39092
listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=INTERNAL
log.dirs=/tmp/kraft-pipeline-logs
num.partitions=3
auto.create.topics.enable=false
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
