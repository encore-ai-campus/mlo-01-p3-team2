{% extends "console/base.html" %}
{% block title %}로그인{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>로그인</h1>
  <form method="post">
    {% csrf_token %}
    {% if form.non_field_errors %}<ul class="errorlist">{% for e in form.non_field_errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
    <label for="id_username">아이디</label>
    <input type="text" name="username" id="id_username" autocomplete="username" autofocus required>
    <label for="id_password">비밀번호</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">로그인</button>
  </form>
  <p class="muted"><a href="{% url 'signup' %}">광고주 가입</a></p>
</div>
{% endblock %}
