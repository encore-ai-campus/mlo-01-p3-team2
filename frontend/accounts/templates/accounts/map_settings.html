<h3>내 계정</h3>
<p class="settings-identity">{{ nickname }}님</p>
<div class="settings-account-actions">
  <a class="settings-account-link" href="{% url 'accounts:nickname' %}"><span>닉네임 변경</span><span aria-hidden="true">›</span></a>
  <form id="campusLogoutForm" class="account-logout" method="post" action="{% url 'accounts:logout' %}">
    {% csrf_token %}
    <button type="submit" class="settings-logout">로그아웃</button>
  </form>
</div>
