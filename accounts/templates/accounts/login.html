{% extends "accounts/base.html" %}
{% block title %}로그인{% endblock %}
{% block heading %}캠퍼스로 들어오세요{% endblock %}
{% block description %}로그인하고 PLAYDATA 캠퍼스를 둘러보세요.{% endblock %}
{% block content %}
  <form method="post" action="{% url 'accounts:login' %}" class="auth-form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include "accounts/form_fields.html" %}
    <button type="submit" class="auth-submit">로그인</button>
  </form>
  <p class="auth-switch">처음 방문하셨나요? <a href="{% url 'accounts:signup' %}">회원가입</a></p>
{% endblock %}
