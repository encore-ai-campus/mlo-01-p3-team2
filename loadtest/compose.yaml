# 메타버스 백엔드 부하 시험(로컬). 실행은 run.py 가 한다 — README.md 참고.
name: campus-load

x-image: &image
  build: .
  image: campus-load:py312

x-backend-env: &backend-env
  DJANGO_DEBUG: "0"
  DJANGO_SECRET_KEY: load-test-only-not-a-secret-0123456789abcdefghij
  DJANGO_ALLOWED_HOSTS: ${BACKEND_HOSTS:-backend,localhost}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${CSRF_ORIGINS:-}
  DATABASE_ENGINE: mysql
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: campus
  MYSQL_USER: campus
  MYSQL_PASSWORD: campus
  CAMPUS_DATA_DIR: /data
  DJANGO_SETTINGS_MODULE: ${SETTINGS:-config.settings}  # 실험용 덮어쓰기(settings_*.py)만 바꾼다
  PYTHONPATH: /load
  CAMPUS_DM_ENABLED: "1"
  CAMPUS_REDIS_URL: ${CAMPUS_REDIS_URL:-}  # 비우면 한 프로세스 메모리 계층(지금 운영과 같다)
  # 운영처럼 브로커 주소는 있지만 닿지 않는다(outbox 에 쌓이고 전송기는 연결을 계속 시도한다)
  KAFKA_BOOTSTRAP_SERVERS: 10.255.255.1:9092

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: load
      MYSQL_DATABASE: campus
      MYSQL_USER: campus
      MYSQL_PASSWORD: campus
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-pload", "--silent"]
      interval: 2s
      retries: 60

  # 운영 game-server 에 apt 로 설치할 판(Ubuntu 24.04 redis-server 7.0). 값은 모두 다시 만들 수 있어 디스크에 저장하지 않는다
  redis:
    image: redis:7.0.15
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  backend:
    <<: *image
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ../backend:/app:ro
      - .:/load:ro
      - data:/data
    environment: *backend-env
    cap_add: [NET_ADMIN, SYS_PTRACE]  # SYS_PTRACE: 원인을 볼 때 py-spy 로 들여다보려고
    # 운영 t3.2xlarge 는 vCPU 8개지만 이 프로세스는 GIL 때문에 코어 하나 분량이 한계다.
    # cpu_quota/cpu_period = 운영 코어 하나의 속도에 맞춘 비율(corebench.py 로 측정, run.py 가 넣는다).
    cpuset: "0-7"
    cpu_period: 10000
    cpu_quota: ${BACKEND_CPU_QUOTA:-5000}
    # 운영 DB·프록시 왕복(약 0.26ms)을 흉내 낸다: 이 컨테이너에서 나가는 패킷에 지연
    command: >
      sh -c "tc qdisc replace dev eth0 root netem delay ${NET_DELAY_US:-250}us &&
             python manage.py migrate --noinput -v 0 &&
             exec ${BACKEND_RUN:-python -u run-campus.py --port 9003 --bind 0.0.0.0 --noreload}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9003/')"]
      interval: 2s
      retries: 60

  # 개발 서버(사람이 접속해 보기): 프론트가 백엔드로 HTTP·WebSocket 을 중계한다(운영 front-a 와 같은 구조). README 의 "개발 서버로 띄우기"
  frontend:
    <<: *image
    profiles: [dev]
    depends_on:
      backend: {condition: service_healthy}
    volumes:
      - ../frontend:/app:ro
    environment:
      BACKEND_URL: ${FRONTEND_BACKEND_URL:-http://backend:9003}  # 여러 프로세스면 nginx:8000(운영 front-a 가 game-server :8000 에 붙는 것과 같다)
      FRONTEND_ALLOWED_HOSTS: ${FRONTEND_HOSTS:-localhost,127.0.0.1}
      FRONTEND_DEBUG: "1"  # 정적 파일을 runserver 가 내준다(운영은 nginx)
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:8004:8004"
    # 중계 측정(계획 M6)에서는 운영 코어 하나로 묶는다(run.py --via-frontend). 평소 개발 서버는 제한 없음
    cpuset: "0-7"
    cpu_period: 10000
    cpu_quota: ${FRONTEND_CPU_QUOTA:-100000}
    command: python manage.py runserver 0.0.0.0:8004 --noreload

  # 여러 프로세스(계획 M4·M5): 소켓 프로세스는 backend 를 --scale 로 늘리고(BACKEND_RUN=daphne …),
  # 백그라운드 작업은 jobs 하나, 앞에서 nginx 가 세션 쿠키로 고정 배정한다(운영 deploy/campus-multiprocess 와 같은 구조)
  jobs:
    <<: *image
    profiles: [multi]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ../backend:/app:ro
      - .:/load:ro
      - data:/data
    environment: *backend-env
    command: python -u manage.py campus_jobs

  nginx:
    image: nginx:1.24.0  # 운영 game-server 에 apt 로 설치할 판(Ubuntu 24.04)
    profiles: [multi]
    depends_on:
      backend: {condition: service_healthy}
    volumes:
      - ./nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro

  # 두 프로세스 확인(계획 M4): 소켓 프로세스 둘과 작업 하나를 이 안에 띄워 프로세스 사이 기능을 확인한다
  cluster-check:
    <<: *image
    profiles: [check]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ../backend:/app:ro
      - .:/load:ro
      - data:/data
    environment:
      <<: *backend-env
      CAMPUS_REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: localhost
    working_dir: /app
    command: sh -c "python manage.py migrate --noinput -v 0 && exec python -u /load/cluster_check.py"

  load:
    <<: *image
    profiles: [load]
    depends_on:
      backend: {condition: service_healthy}
    volumes:
      - .:/load:ro
      - data:/data
    environment:
      CAMPUS_HOST: ${CAMPUS_HOST:-backend}  # 여러 프로세스면 nginx
      CAMPUS_PORT: ${CAMPUS_PORT:-9003}
    working_dir: /load
    cpuset: "8-11"

volumes:
  data:
