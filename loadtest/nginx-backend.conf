# 부하 시험용(운영 deploy/campus-multiprocess/nginx-campus-backend.conf 와 같은 규칙).
# backend 는 --scale 로 늘린 컨테이너들이다: 이름 하나가 여러 주소로 풀리면 nginx 는 그 주소를 모두 upstream 서버로 쓴다(시작할 때 한 번)
upstream campus_backend {
    hash $cookie_campus_sessionid consistent;
    server backend:9003 max_fails=2 fail_timeout=10s;
}

upstream campus_sockets {
    least_conn;
    server backend:9003 max_fails=2 fail_timeout=10s;
}

map $http_upgrade $campus_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8000;
    client_max_body_size 1m;
    # 웹소켓은 접속이 가장 적은 프로세스로(계획 §8): 쿠키 해시는 100명에서 34·20·22·32 처럼 쏠렸다.
    # 같은 세션이 다른 프로세스에 다시 붙으면 옛 연결은 cluster 의 교체(4409, 계획 M4)로 닫힌다
    location /ws/campus/ {
        proxy_pass http://campus_sockets;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $campus_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout;
    }
    location / {
        proxy_pass http://campus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $campus_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout;
    }
}
