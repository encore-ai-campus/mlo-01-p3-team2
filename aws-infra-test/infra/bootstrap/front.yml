---
- name: 테스트 Front의 HTTP 분기 준비
  hosts: frontend
  become: true
  any_errors_fatal: true
  environment: "{{ proxy_environment }}"
  tasks:
    - name: 테스트 대상과 앱 노드 확인
      ansible.builtin.assert:
        that:
          - test_project == 'aws-infra-test'
          - groups['frontend'] | length == 1
          - groups['game'] | length == 1
          - groups['ad'] | length == 1
          - test_client_cidrs | length > 0
    - name: Nginx 설치
      ansible.builtin.apt:
        name: nginx
        update_cache: true
        state: present
    - name: 정적 파일 저장 경로
      ansible.builtin.file:
        path: /srv/aws-infra-test/static
        state: directory
        mode: '0755'
    - name: 운영자가 지정한 collectstatic 결과 배포
      ansible.builtin.copy:
        src: "{{ test_static_source }}/"
        dest: /srv/aws-infra-test/static/
        mode: '0644'
        directory_mode: '0755'
      when: test_static_source is defined
    - name: 기본 사이트 제거
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
    - name: HTTP와 WebSocket 분기 설정
      ansible.builtin.template:
        src: templates/front.conf.j2
        dest: /etc/nginx/conf.d/aws-infra-test.conf
        mode: '0644'
    - name: 설정 문법 확인
      ansible.builtin.command: nginx -t
      changed_when: false
    - name: Nginx 시작 및 변경 반영
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: restarted
