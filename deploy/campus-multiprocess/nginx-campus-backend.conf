# game-server: /etc/nginx/sites-available/campus-backend → sites-enabled 에 링크
# front-a 의 프론트 중계가 붙는 :8000 을 받아 소켓 프로세스들에 나눈다. 같은 로그인 세션은 늘 같은 프로세스로 간다
upstream campus_backend {
    hash $cookie_campus_sessionid consistent;
    server 127.0.0.1:9101 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:9102 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:9103 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:9104 max_fails=2 fail_timeout=10s;
}

map $http_upgrade $campus_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8000;
    # 프론트 중계와 같은 한도(front-a nginx 기본 1m)
    client_max_body_size 1m;

    location / {
        proxy_pass http://campus_backend;
        proxy_http_version 1.1;
        # 중계가 보낸 Host·X-Forwarded-Proto·Cookie 를 그대로 넘긴다(CSRF·ALLOWED_HOSTS 판단은 백엔드가 한다)
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $campus_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout;
    }
}
