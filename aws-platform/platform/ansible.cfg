[defaults]
# 현재 배포 프로필의 생성 인벤토리를 기본으로 사용한다. 다른 프로필은 -i로 지정한다.
inventory = inventory/hosts.current.yml
roles_path = roles
retry_files_enabled = False
# 대상 서버의 시스템 Python(AL2023은 3.9, Ubuntu 24.04는 3.12)을 쓰도록 고정한다. AL2023에서 Spark용 Python 3.12를 따로 설치해도 dnf 모듈이 깨지지 않게 하기 위함이다.
interpreter_python = /usr/bin/python3

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
