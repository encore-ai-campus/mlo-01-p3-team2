---
# 새 배스천도 동일한 설정으로 준비한다. 실제 주소·포트·VPC 범위는 인벤토리를 따른다.
- name: 배스천 Squid 설치와 접근 규칙 준비
  hosts: bastion
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: 프록시 입력 확인
      ansible.builtin.assert:
        that:
          - proxy_enabled | default(false) | bool
          - groups.get('bastion', []) | length == 1
          - proxy_client_cidrs | length > 0
          - proxy_port | int >= 1 and proxy_port | int <= 65535

    - name: Ubuntu 공식 HTTPS 저장소에서 Squid 최초 설치
      ansible.builtin.script:
        cmd: '"{{ playbook_dir }}/scripts/install-squid.sh"'
        creates: /usr/sbin/squid

    - name: 변경 전 Squid 설정 보관
      ansible.builtin.slurp:
        src: /etc/squid/squid.conf
      register: proxy_squid_before

    - name: 기본 접근 거부 규칙 확인
      ansible.builtin.assert:
        that:
          - (proxy_squid_before.content | b64decode | regex_findall('(?m)^[ \t]*http_access[ \t]+deny[ \t]+all[ \t]*$')) | length == 1
        fail_msg: 기본 deny all 규칙이 정확히 하나 있는 Squid 설정이 필요합니다.

    - name: 프록시 설정 적용
      block:
        # 이전에 수동으로 넣은 프로젝트 규칙만 정리하고 아래 관리 블록으로 대체한다.
        - name: 기존 project_ec2 수동 규칙 정리
          ansible.builtin.replace:
            path: /etc/squid/squid.conf
            regexp: '(?m)^[ \t]*(?:acl[ \t]+project_ec2[ \t]+src[^\n]*|http_access[ \t]+allow[ \t]+project_ec2)[ \t]*\n?'
            replace: ''
            backup: true
          register: proxy_squid_legacy

        - name: 프로젝트 VPC 접근을 최종 거부 규칙 앞에 배치
          ansible.builtin.blockinfile:
            path: /etc/squid/squid.conf
            marker: '# {mark} ANSIBLE PLATFORM PROXY'
            insertbefore: '^[ \t]*http_access[ \t]+deny[ \t]+all[ \t]*$'
            block: |
              acl platform_proxy_clients src {{ proxy_client_cidrs | join(' ') }}
              http_access allow platform_proxy_clients
            backup: true
          register: proxy_squid_acl

        - name: 프록시 수신 포트 지정
          ansible.builtin.lineinfile:
            path: /etc/squid/squid.conf
            regexp: '^[ \t]*http_port[ \t]+'
            line: 'http_port {{ proxy_port }}'
            backup: true
          register: proxy_squid_port

        - name: 서비스에 적용하기 전 Squid 문법 검사
          ansible.builtin.command:
            argv: [/usr/sbin/squid, -k, parse]
          changed_when: false

        - name: Squid 실행과 부팅 시 시작 설정
          ansible.builtin.systemd_service:
            name: squid
            enabled: true
            state: "{{ 'restarted' if (proxy_squid_legacy.changed or proxy_squid_acl.changed or proxy_squid_port.changed) else 'started' }}"
      rescue:
        - name: 실패한 설정을 변경 전 내용으로 복원
          ansible.builtin.copy:
            dest: /etc/squid/squid.conf
            content: "{{ proxy_squid_before.content | b64decode }}"
            owner: root
            group: root
            mode: '0644'

        - name: 복원한 설정으로 Squid 재시작
          ansible.builtin.systemd_service:
            name: squid
            state: restarted

        - name: 이후 배포 중단
          ansible.builtin.fail:
            msg: Squid 설정 적용에 실패해 기존 설정을 복원했습니다. 앞선 오류를 확인하세요.
