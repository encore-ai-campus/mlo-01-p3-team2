---
# Cluster 설정·패키지를 재적용하지 않고 Router 대상의 계정만 준비한다.
- name: OS별 MySQL 경로 로드
  ansible.builtin.include_vars: "{{ ansible_facts['distribution'] | lower }}.yml"

- name: Router 계정 준비 입력 확인
  ansible.builtin.assert:
    that:
      - groups.get('mysql', []) | length >= 3
      - ansible_play_hosts_all | sort == groups['mysql'] | sort
      - mysql_router_source_groups | length > 0
      - mysql_cluster_name is match('^[A-Za-z0-9_][A-Za-z0-9_.-]{0,62}$')
      - vault_mysql_passwords.root | length > 0
      - vault_mysql_passwords.failover | length > 0
      - vault_mysql_passwords.router | length > 0
      - vault_mysql_passwords.dev | length > 0
      - vault_mysql_passwords.dev is not search("['\"\\\\$`\r\n]")
    fail_msg: Router 단독 실행에도 MySQL 전체 그룹과 기존 Vault 계정이 필요합니다. 대상을 생략하거나 --limit에 mysql 그룹도 포함하세요.
  no_log: true

- name: 공통 Router 대상 계산
  ansible.builtin.set_fact:
    mysql_router_hosts: "{{ groups | dict2items | selectattr('key', 'in', mysql_router_source_groups) | map(attribute='value') | flatten | unique | list }}"

- name: Router 출처 IP 확인
  ansible.builtin.assert:
    that:
      - hostvars[item].ip is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
      - hostvars[item].ip.split('.') | map('int') | max <= 255
  loop: "{{ mysql_router_hosts }}"

- name: 현재 ONLINE 멤버 역할 조회
  ansible.builtin.command: >-
    mysql -uroot -S {{ mysql_socket }} -N -e
    "SELECT MEMBER_ROLE FROM performance_schema.replication_group_members
    WHERE MEMBER_ID = @@server_uuid AND MEMBER_STATE = 'ONLINE'"
  environment:
    MYSQL_PWD: "{{ vault_mysql_passwords.root }}"
  register: mysql_router_member
  changed_when: false
  no_log: true

- name: 단일 Primary와 ONLINE 멤버 확인
  ansible.builtin.assert:
    that:
      - groups['mysql'] | map('extract', hostvars, ['mysql_router_member', 'stdout']) | select('equalto', 'PRIMARY') | list | length == 1
      - groups['mysql'] | map('extract', hostvars, ['mysql_router_member', 'stdout']) | reject('in', ['PRIMARY', 'SECONDARY']) | list | length == 0
  run_once: true

- name: 현재 Primary에서 Router 접속 계정 준비
  when: mysql_router_member.stdout == 'PRIMARY'
  block:
    # 기존 업무 계정은 보존하고 새 Router 출처의 dev 계정만 추가한다.
    - name: 없는 Router 클라이언트 계정 생성
      ansible.builtin.command: mysqlsh --js --no-wizard --quiet-start=2
      args:
        stdin: "{{ lookup('ansible.builtin.template', 'router-dev-access.js.j2') }}"
      register: mysql_router_dev_result
      changed_when: "'INFRA_ROUTER_DEV_CREATED' in mysql_router_dev_result.stdout"
      no_log: true

    - name: Router 공통 메타데이터 계정 준비
      ansible.builtin.import_tasks: router-accounts.yml

- name: Router 계정 준비 완료 표시
  ansible.builtin.set_fact:
    mysql_router_access_ready: true
