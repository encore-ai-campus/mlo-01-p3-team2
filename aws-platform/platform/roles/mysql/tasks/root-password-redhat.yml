---
# root 비밀번호 (AL2023): 첫 시작 때 임시 비밀번호가 오류 로그에 생성된다.
# 첫 시작 때 생성된 임시 비밀번호로 로그인해 Vault의 비밀번호로 바꾼다. 이미 바뀌었으면 건너뛴다.
- name: root 비밀번호가 이미 설정되었는지 확인
  ansible.builtin.command: mysql -uroot -S {{ mysql_socket }} -e "SELECT 1"
  environment:
    MYSQL_PWD: "{{ vault_mysql_passwords.root }}"
  register: mysql_root_check
  changed_when: false
  failed_when: false
  no_log: "{{ mysql_no_log }}"

- name: root 임시 비밀번호 조회
  ansible.builtin.shell: grep 'temporary password' {{ mysql_error_log }} | tail -1 | awk '{print $NF}'
  register: mysql_temp_password
  changed_when: false
  when: mysql_root_check.rc != 0
  no_log: "{{ mysql_no_log }}"

# 비밀번호가 만료된 세션에서는 ALTER USER 외의 문장(SET sql_log_bin 포함)을 쓸 수 없다.
# 기본 노드가 아닌 서버는 변경 뒤에 바이너리 로그와 GTID를 비워, 나중에 Primary에서 복구할 때 충돌하지 않게 한다.
- name: root 비밀번호 변경
  ansible.builtin.command: mysql --connect-expired-password -uroot -S {{ mysql_socket }}
  args:
    stdin: |
      ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ vault_mysql_passwords.root }}';
      {% if not mysql_is_primary %}
      RESET BINARY LOGS AND GTIDS;
      {% endif %}
  environment:
    MYSQL_PWD: "{{ mysql_temp_password.stdout }}"
  changed_when: true
  when: mysql_root_check.rc != 0
  no_log: "{{ mysql_no_log }}"

