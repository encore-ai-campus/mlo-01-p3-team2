---
# 설치 출처: Apache 배포 tarball. 앞의 미러부터 시도한다(dlcdn → downloads → archive). dlcdn은 빠르지만 최신 릴리스만 남고,
# archive는 구형 릴리스도 남지만 매우 느리다(시험에서 약 50KB/s). 어느 쪽에서 받아도 아래 sha512로 검증한다.
kafka_version: 4.3.1
kafka_scala_version: "2.13"
kafka_urls:
  - "https://dlcdn.apache.org/kafka/{{ kafka_version }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
  - "https://downloads.apache.org/kafka/{{ kafka_version }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
  - "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
# 배포처의 .sha512 파일 값. 버전을 바꾸면 같이 바꾼다.
kafka_sha512: c7d7b2318cb51aa0c61d3246a51c349210073c5c9b754947ef965a439f2f939e8600f204e134a75ac31faf3829c9370960ef7c6a9886c8a1dbf0339a21f4c54c

kafka_user: kafka
kafka_install_dir: "/opt/kafka_{{ kafka_scala_version }}-{{ kafka_version }}"
kafka_home: /opt/kafka
kafka_config_dir: /etc/kafka
kafka_data_dir: /var/lib/kafka/data
kafka_log_dir: /var/log/kafka

kafka_broker_port: 9092
kafka_controller_port: 9093

# JVM heap = 전체 RAM의 비율 (서버 타입에 의존하지 않도록 RAM에서 계산한다). 나머지는 OS 페이지 캐시로 남긴다.
kafka_heap_ratio: 0.25
kafka_heap_min_mb: 256
kafka_heap_max_mb: 6144

# 검증용 임시 토픽 (자동 생성이 꺼져 있어 직접 만들고 지운다)
kafka_check_topic: infra-check
