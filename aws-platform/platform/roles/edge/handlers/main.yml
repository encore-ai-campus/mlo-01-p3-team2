---
- name: Edge Nginx 문법 검사
  ansible.builtin.command: /usr/sbin/nginx -t
  changed_when: false
  listen: Edge Nginx 재적용

- name: Edge Nginx 재로드
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  listen: Edge Nginx 재적용

- name: Edge 갱신 타이머 재시작
  ansible.builtin.systemd_service:
    name: edge-certbot-renew.timer
    state: restarted
    enabled: true
    daemon_reload: true
