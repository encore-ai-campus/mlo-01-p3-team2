---
# root 비밀번호 (Ubuntu): 설치 직후 root는 auth_socket(비밀번호 없음)이다. 서버 안에서 소켓으로 접속해 비밀번호 방식으로 바꾼다.
# 이미 바뀌었으면 Vault의 비밀번호로 접속되므로 건너뛴다 (auth_socket 계정은 비밀번호를 무시하므로 인증 방식을 직접 확인한다).
- name: root 인증 방식 확인
  ansible.builtin.command: mysql -uroot -S {{ mysql_socket }} -N -e "SELECT plugin FROM mysql.user WHERE user = 'root' AND host = 'localhost'"
  environment:
    MYSQL_PWD: "{{ vault_mysql_passwords.root }}"
  register: mysql_root_plugin
  changed_when: false
  no_log: "{{ mysql_no_log }}"

# Ubuntu의 MySQL에는 비밀번호 정책 컴포넌트가 기본으로 없다. AL2023과 같은 정책(MEDIUM)을 위해 설치한다 (포팅 계획 D4).
- name: 비밀번호 정책 컴포넌트 확인
  ansible.builtin.command: mysql -uroot -S {{ mysql_socket }} -N -e "SELECT COUNT(*) FROM mysql.component WHERE component_urn = 'file://component_validate_password'"
  environment:
    MYSQL_PWD: "{{ vault_mysql_passwords.root }}"
  register: mysql_validate_password
  changed_when: false
  when: mysql_root_plugin.stdout == 'auth_socket'
  no_log: "{{ mysql_no_log }}"

# 기본 노드가 아닌 서버는 변경 뒤에 바이너리 로그와 GTID를 비워, 나중에 Primary에서 복구할 때 충돌하지 않게 한다.
- name: root 비밀번호 설정 (auth_socket에서 비밀번호 방식으로)
  ansible.builtin.command: mysql -uroot -S {{ mysql_socket }}
  args:
    stdin: |
      {% if mysql_validate_password.stdout == '0' %}
      INSTALL COMPONENT 'file://component_validate_password';
      {% endif %}
      ALTER USER 'root'@'localhost' IDENTIFIED WITH caching_sha2_password BY '{{ vault_mysql_passwords.root }}';
      {% if not mysql_is_primary %}
      RESET BINARY LOGS AND GTIDS;
      {% endif %}
  changed_when: true
  when: mysql_root_plugin.stdout == 'auth_socket'
  no_log: "{{ mysql_no_log }}"
