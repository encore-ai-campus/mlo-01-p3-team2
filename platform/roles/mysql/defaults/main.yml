---
# 설치 출처: MySQL 8.4 LTS. 이 파일의 URL은 AL2023(Yum)용이고 Ubuntu(APT)는 vars/ubuntu.yml이다. GPG 키는 둘 다 같은 2025 키다.
mysql_repo_baseurl: https://repo.mysql.com/yum/mysql-8.4-community/el/9/$basearch/
mysql_tools_repo_baseurl: https://repo.mysql.com/yum/mysql-tools-8.4-community/el/9/$basearch/
mysql_gpg_key_url: https://repo.mysql.com/RPM-GPG-KEY-mysql-2025
mysql_gpg_key_id: a8d3785c   # 위 키의 key ID 끝 8자리 (rpm의 gpg-pubkey 이름)
mysql_packages: [mysql-community-server, mysql-shell]

mysql_accounts_stamp: /etc/mysql-infra-accounts.sha256

# innodb_buffer_pool_size = 전체 RAM의 비율 (서버 타입에 의존하지 않도록 RAM에서 계산한다)
mysql_buffer_pool_ratio: 0.5
mysql_buffer_pool_min_mb: 128

# 계정 접속 허용 출처 (YAML 서버 목록의 그룹)
mysql_dev_source_groups: [backend, spark, bastion]
mysql_failover_extra_source_groups: [bastion]

# dev 계정 권한. 시스템 스키마에서는 모두 뺀다.
mysql_dev_privileges: SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES, CREATE VIEW, SHOW VIEW, TRIGGER, EVENT, CREATE ROUTINE, ALTER ROUTINE, EXECUTE, LOCK TABLES, CREATE TEMPORARY TABLES
mysql_system_schemas: [mysql, sys]  # performance_schema는 root도 revoke할 수 없다 (쓰기는 setup_* 테이블 UPDATE 정도로 제한된다)

mysql_replicaset_name: infra

# 비밀번호가 들어가는 task의 출력을 숨긴다. 문제를 찾을 때만 -e mysql_no_log=false 로 끈다.
mysql_no_log: true
