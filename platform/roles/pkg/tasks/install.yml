---
# 패키지 설치 (두 OS 공통). 입력: pkg_names (목록)
# 이미 설치된 패키지는 패키지 관리자를 거치지 않는다. dnf는 메모리를 많이 써서 작은 VM에서 강제 종료될 수 있고,
# 임시 NAT를 제거한 뒤 재실행해도 저장소 접속 없이 통과한다.
- name: 설치된 패키지 확인
  ansible.builtin.package_facts:

- name: 없는 패키지 계산
  ansible.builtin.set_fact:
    pkg_missing: "{{ pkg_names | difference(ansible_facts.packages.keys()) }}"

- name: 없는 패키지만 설치 (dnf)
  ansible.builtin.dnf:
    name: "{{ pkg_missing }}"
    state: present
  when: ansible_facts['os_family'] == 'RedHat' and pkg_missing | length > 0

# apt: 첫 부팅 직후 unattended-upgrades가 dpkg 잠금을 잡을 수 있어 기다리고,
# 설치 중 needrestart가 서비스를 다시 시작하지 않게 목록만 만들도록 한다 (D2).
# 저장소를 방금 추가했을 수 있으므로 설치할 패키지가 있을 때마다 목록을 갱신한다.
- name: 없는 패키지만 설치 (apt)
  ansible.builtin.apt:
    name: "{{ pkg_missing }}"
    state: present
    update_cache: true
    lock_timeout: 300
  environment:
    DEBIAN_FRONTEND: noninteractive
    NEEDRESTART_MODE: l
  when: ansible_facts['os_family'] == 'Debian' and pkg_missing | length > 0
