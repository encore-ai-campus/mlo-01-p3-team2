---
# 2026-10-10 AWS 조회로 확인한 현재 EC2 목록. 운영자 로컬 파일이므로 Git에 올리지 않는다.
# Ansible은 PC의 Linux/WSL에서 실행하며, 키 파일은 해당 환경의 ~/.ssh/project-key에 둔다.
all:
  vars:
    ansible_user: ubuntu
    proxy_enabled: true
    project_key_directory: "{{ lookup('env', 'HOME') }}/.ssh/project-key"
    users: []
  children:
    account1:
      vars:
        ansible_ssh_private_key_file: "{{ project_key_directory }}/project-bastion.pem"
      hosts:
        bastion-01: { ip: 10.10.0.238, public_ip: 3.36.49.143 }
        front-a: { ip: 10.10.0.117 }
        front-b: { ip: 10.10.1.221 }
        game-server: { ip: 10.10.10.235 }
        ad-server: { ip: 10.10.11.75 }
    account2:
      vars:
        ansible_ssh_private_key_file: "{{ project_key_directory }}/account2.pem"
      hosts:
        mongo-1: { ip: 10.20.10.191 }
        spark-2: { ip: 10.20.10.181 }
    account3:
      vars:
        ansible_ssh_private_key_file: "{{ project_key_directory }}/account3.pem"
      hosts:
        kafka-1: { ip: 10.30.10.46 }
        mysql-1: { ip: 10.30.10.253 }
        spark-1: { ip: 10.30.10.138 }
        mongo-2: { ip: 10.30.11.181 }
    account4:
      vars:
        ansible_ssh_private_key_file: "{{ project_key_directory }}/account4.pem"
      hosts:
        kafka-2: { ip: 10.40.10.186 }
        spark-3: { ip: 10.40.11.241 }
    account5:
      vars:
        ansible_ssh_private_key_file: "{{ project_key_directory }}/account5.pem"
      hosts:
        mysql-2: { ip: 10.50.11.62 }
        mongo-3: { ip: 10.50.10.88 }
        kafka-3: { ip: 10.50.11.40 }
    bastion:
      hosts:
        bastion-01: {}
    frontend:
      hosts:
        front-a: {}
        front-b: {}
    # game/ad의 설치 역할은 별도 결정한다. 프록시 준비 대상에는 포함한다.
    game:
      hosts:
        game-server: {}
    ad:
      hosts:
        ad-server: {}
    mongodb:
      hosts:
        mongo-1: {}
        mongo-2: {}
        mongo-3: {}
    mysql:
      hosts:
        mysql-1: {}
        mysql-2: {}
    kafka:
      hosts:
        kafka-1: {}
        kafka-2: {}
        kafka-3: {}
    spark:
      hosts:
        spark-1: {}
        spark-2: {}
        spark-3: {}
