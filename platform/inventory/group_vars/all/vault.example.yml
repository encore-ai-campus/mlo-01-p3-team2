---
# Secret 파일의 형식 예시다. 이 파일에는 값을 채우지 않는다.
#
# 사용 방법
#   1) Vault 비밀번호 파일을 만든다: platform/.vault_pass 에 Vault 비밀번호를 한 줄로 적는다.
#      (platform/.gitignore가 .vault*를 무시하므로 저장소에 올라가지 않는다.)
#   2) cp vault.example.yml vault.yml 로 복사해 아래 값을 채운다.
#   3) ansible-vault encrypt vault.yml 로 암호화한다. vault.yml은 암호화한 것도 저장소에 올리지 않는다(platform/.gitignore).
#   4) 실행할 때: export ANSIBLE_VAULT_PASSWORD_FILE=.vault_pass   (platform/ 에서)
#      값을 고칠 때: ansible-vault edit vault.yml
#
# 값을 쓰는 방법
#   - 값은 큰따옴표로 감싼다.
#   - 비밀번호에는 작은따옴표('), 큰따옴표("), 백슬래시(\), 달러($), 백틱(`)을 쓰지 않는다.
#   - MySQL은 기본으로 비밀번호 정책(8자 이상, 대문자·소문자·숫자·특수문자를 각각 1개 이상)을 검사한다.
#     MongoDB도 같은 규칙으로 쓰면 편하다. 계정마다 서로 다른 값을 쓴다.

# MySQL 계정 비밀번호 (6개)
vault_mysql_passwords:
  root: ""          # 서버 안(localhost)에서만 쓰는 관리용
  dev: ""           # 개발자와 애플리케이션용
  replication: ""   # 복제용
  monitor: ""       # 모니터링용 읽기 전용
  failover: ""      # ReplicaSet 관리와 failover용 원격 관리 계정
  router: ""        # MySQL Router용 계정 (Backend에서만 접속, ReplicaSet일 때만 만든다)

# MongoDB 계정 비밀번호 (3개). replication, failover 계정은 없다.
vault_mongodb_passwords:
  root: ""          # 관리자
  dev: ""           # 읽기/쓰기
  monitor: ""       # 모니터링

# MongoDB keyfile 내용. Replica Set 멤버끼리 서로를 인증하는 공유 비밀이다.
# 생성: openssl rand -base64 756   (출력 전체를 한 덩어리로 붙여넣는다. 줄바꿈이 있어도 된다.)
vault_mongodb_keyfile: |
  여기에-생성한-값을-붙여넣는다

# Monitoring이 모든 서버에 SSH로 접속할 때 쓰는 monitor 사용자의 키 쌍
# 생성: ssh-keygen -t ed25519 -N "" -C monitor -f ./monitor_key
#       (monitor_key = 개인키, monitor_key.pub = 공개키. 생성한 파일은 값을 옮긴 뒤 삭제한다.)
vault_monitor_ssh_private_key: |
  -----BEGIN OPENSSH PRIVATE KEY-----
  여기에-개인키-내용을-붙여넣는다
  -----END OPENSSH PRIVATE KEY-----
vault_monitor_ssh_public_key: "ssh-ed25519 AAAA... monitor"
